name: Build iOS dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Theos, iOS SDK, and ldid
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1
        HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid || true
        if ! command -v ldid &> /dev/null; then
          mkdir -p $HOME/theos/bin
          printf '#!/bin/bash\nfor last; do true; done\ncodesign -f -s - "$last" || true\n' > $HOME/theos/bin/ldid
          chmod +x $HOME/theos/bin/ldid
        fi

    - name: Compile dylib
      run: |
        export THEOS=$HOME/theos
        export PATH="$HOME/theos/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
        make all

    - name: Upload Compiled dylib
      uses: actions/upload-artifact@v4
      with:
        name: HorrorfieldNoAds-dylib
        path: .theos/obj/debug/HorrorfieldNoAds.dylib
