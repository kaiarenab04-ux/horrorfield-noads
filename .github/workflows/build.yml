name: Build iOS dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Pure iOS dylib (No Jailbreak)
      run: |
        xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
          -miphoneos-version-min=13.0 \
          -fobjc-arc \
          -framework Foundation -framework UIKit \
          -install_name @rpath/HorrorfieldNoAds.dylib \
          -x objective-c Tweak.xm \
          -o HorrorfieldNoAds.dylib
        codesign -f -s - HorrorfieldNoAds.dylib

    - name: Upload Compiled dylib
      uses: actions/upload-artifact@v4
      with:
        name: HorrorfieldNoAds-dylib
        path: HorrorfieldNoAds.dylib
